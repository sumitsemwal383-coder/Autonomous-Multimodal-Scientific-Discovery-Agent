
name: Agent Continuous Integration Pipeline

on:
  push:
    branches:
      - janhavi
  pull_request:
    branches:
      - main

jobs:
  test-agent-suite:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify Package Imports
        run: |
          pwd
          ls -la
          ls -la src
          ls -la src/ingestion
          python -c "import sys; print(sys.path)"
          python -c "import src; print('src package:', src.__file__)"
          python -c "import src.ingestion; print('ingestion package:', src.ingestion.__file__)"
          python -c "from src.ingestion.arxiv_pipeline import ArxivPipeline; print('Arxiv import successful')"
          python -c "from src.ingestion.pubmed_pipeline import PubMedPipeline; print('PubMed import successful')"

      - name: Run Holdout Benchmark Tests
        run: python -m pytest tests/test_benchmark_evaluator.py -v
